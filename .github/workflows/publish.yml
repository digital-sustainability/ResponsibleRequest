name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run ruff check
      # numpy's stubs on 3.11+ use syntax mypy rejects under python_version = 3.10
      - if: matrix.python-version == '3.10'
        run: uv run mypy src
      - run: uv run pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/responsible-request/
    permissions:
      id-token: write  # Trusted Publishing; no API token stored in the repo
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches pyproject version
        run: |
          version=$(uv version --short)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version"; exit 1; }
      - run: uv build
      - run: uv publish
